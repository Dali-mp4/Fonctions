name: V2 quality checks
on:
  push:
    branches: [algo-fi-jib-v2, "v2/**"]
  pull_request:
    branches: [algo-fi-jib-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r api/requirements-dev.txt
      - run: pytest -q api/tests
        env:
          PYTHONPATH: api
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:queries
      - run: npm run test:contract
      - run: npm run test:runner
      - run: npm run test:review
      - run: npm run test:catalog
      - run: npm run test:unified
      - run: npm run test:account
      - run: npm run test:google
      - run: npm run typecheck
      - run: npm run build
